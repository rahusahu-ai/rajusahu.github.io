<section class="kite-panel" aria-labelledby="kite-title">
  <div class="kite-header">
    <span class="kite-logo" aria-hidden="true">K</span>
    <div>
      <p class="eyebrow">Kite Trading</p>
      <h1 id="kite-title">Nifty 50 Market Data</h1>
    </div>
  </div>

  <p class="description">
    Sign in to Kite and retrieve the latest Nifty 50 market information through the portfolio server.
  </p>

  <form class="market-form" (ngSubmit)="getMarketData()">
    <h2>Market data filters</h2>

    <div class="filter-grid">
      <label class="field">
        <span>From date</span>
        <input type="date" name="fromDate" [(ngModel)]="fromDate" required />
      </label>

      <label class="field">
        <span>To date</span>
        <input type="date" name="toDate" [(ngModel)]="toDate" required />
      </label>

      <label class="field">
        <span>Time interval</span>
        <select name="interval" [(ngModel)]="interval">
          @for (item of intervals; track item.value) {
            <option [value]="item.value">{{ item.label }}</option>
          }
        </select>
      </label>

      <label class="field">
        <span>Years to backfill</span>
        <select name="years" [(ngModel)]="years">
          @for (year of backfillYears; track year) {
            <option [ngValue]="year">{{ year }}</option>
          }
        </select>
      </label>

      <label class="field">
        <span>Instrument type</span>
        <select name="instrumentType" [(ngModel)]="instrumentType" (ngModelChange)="onInstrumentFiltersChange()">
          <option value="normal">Normal</option>
          <option value="option">Option</option>
          <option value="future">Future</option>
        </select>
      </label>

      <label class="field">
        <span>Exchange</span>
        <select name="exchange" [(ngModel)]="exchange" (ngModelChange)="onExchangeChange()">
          @for (item of exchangeList; track item.value) {
            <option [value]="item.value">{{ item.label }}</option>
          }
        </select>
      </label>

      <label class="field">
        <span>Segment</span>
        <select name="segment" [(ngModel)]="segment" (ngModelChange)="onSegmentChange()" [disabled]="!segmentList.length">
          @for (item of segmentList; track item.value) {
            <option [value]="item.value">{{ item.label }}</option>
          }
        </select>
      </label>

      <label class="field symbol-field">
        <span>Entity</span>
        <select
          name="entity"
          [(ngModel)]="instrumentToken"
          (ngModelChange)="onInstrumentChange($event)"
          [disabled]="!filteredEntities.length"
          required
        >
          @for (item of filteredEntities; track item.instrument_token) {
            <option [value]="item.instrument_token">
              {{ item.tradingsymbol }}
            </option>
          }
        </select>
      </label>
    </div>

    <label class="save-to-db">
      <input type="checkbox" name="saveToDb" [(ngModel)]="saveToDb" />
      <span>Save retrieved data to DB</span>
    </label>

    <div class="market-actions">
      <button class="get-button" type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Loading…' : 'Get' }}
      </button>
      <button class="get-button secondary" type="button" (click)="backfillHistoricalData()" [disabled]="isLoading">
        {{ isLoading ? 'Working…' : 'Backfill' }}
      </button>
    </div>
  </form>

  <div class="actions">
    <button type="button" (click)="loginToKite()" [disabled]="isLoading">
      {{ isLoading ? 'Working…' : 'Login to Kite' }}
    </button>
    <button type="button" class="secondary" (click)="getprofile()" [disabled]="isLoading">
      {{ isLoading ? 'Loading…' : 'Get Profile Data' }}
    </button>
  </div>

  <p class="status" role="status" aria-live="polite">{{ status }}</p>

  @if (nifty50Data) {
    <pre>{{ nifty50Data | json }}</pre>
  }

</section>
