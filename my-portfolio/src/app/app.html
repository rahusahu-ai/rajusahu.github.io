


<main>
  @if (currentRoute === 'tradeAnalysis' || currentRoute === 'trade'|| currentRoute === 'tradeLogin') {
    <router-outlet />
  } @else {
    <!-- Your main portfolio content (only shown on home route) -->
    <ng-container>
      <!-- Contact Card with Icons -->
      <app-header
  [name]="name"
  [role]="role"
  [github]="github"
  [isDark]="isDark"
  [toggleTheme]="toggleTheme.bind(this)">
</app-header>
    <app-contact-card 
      [email]="email" 
      [phone]="phone" 
      [location]="location"
      [name]="name" 
      [role]="role" 
      [github]="github">
    </app-contact-card>

    <app-skills></app-skills>
    <app-experience></app-experience>
    <app-education></app-education>
    <app-projects></app-projects>
      <app-contact-form></app-contact-form>

      <app-footer></app-footer>
    </ng-container>
  }
</main>
